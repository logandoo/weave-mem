name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint + syntax (scoped hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff (E9,F63,F7,F82,F841,F401 归零口径)
        # 硬核集：语法错误/未定义名/未用变量/未用导入。全量风格集（DTZ/B008/BLE/UP 等
        # 300+ 条）为上游继承风格面，不作 CI 门（与历史 wave 的 ruff 定向扫描口径一致）。
        run: ruff check --select E9,F63,F7,F82,F841,F401 backend/app/
      - name: Backend syntax
        run: python -m compileall -q backend/app/

  sqlite-smoke:
    name: SQLite mode suites (zero external deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: bash script/linux/install_venv.sh
      - name: Start service (sqlite mode)
        run: |
          sed -i 's/^type = "postgres"/type = "sqlite"/' backend/config.toml
          bash script/linux/start.sh
          sleep 4
          curl -fsS http://127.0.0.1:8202/healthz
      - name: SQLite suites
        run: |
          ./.venv/bin/python tests/test_sqlite_mode.py
          ./.venv/bin/python tests/test_sync_p0.py
          ./.venv/bin/python tests/test_adoption.py
          ./.venv/bin/python tests/test_p2_gates.py
          ./.venv/bin/python tests/test_recall_log.py

  pg-full:
    name: PG full suites (pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: weave_mem
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: bash script/linux/install_venv.sh
      - name: Init DB + start service
        run: |
          bash script/linux/init_db.sh
          bash script/linux/start.sh
          sleep 4
          curl -fsS http://127.0.0.1:8202/healthz
      - name: Full acceptance suites
        run: |
          for t in test_api test_recall test_ingest_clarify test_clarify_apply test_blindspot \
                   test_full_chain test_pat test_mcp test_sync_p0 test_adoption \
                   test_p2_gates test_recall_log; do
            ./.venv/bin/python tests/$t.py || exit 1
          done
