[project]
name = "weave-mem-client"
version = "0.1.0"
description = "Typed async client SDK for the weave-mem memory service (concepts / recall / adoption / ledger / admin)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["weave_mem_client*"]
